name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sistra
          POSTGRES_PASSWORD: sistra
          POSTGRES_DB: sistra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sistra" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Uji (SQLite)
        if: matrix.db == 'sqlite'
        run: pytest -q --cov=app --cov-fail-under=70
      - name: Uji (PostgreSQL)
        if: matrix.db == 'postgres'
        env:
          SISTRA_DATABASE_URL: postgresql+psycopg://sistra:sistra@localhost:5432/sistra_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
