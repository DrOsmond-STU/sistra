# SISTRA MVP — jalankan: cp .env.example .env && docker compose up --build
# Aplikasi: http://localhost:8080   ·   Dokumentasi API: http://localhost:8080/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistra
      POSTGRES_USER: sistra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistra -d sistra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      SISTRA_ENV: ${SISTRA_ENV:-development}
      SISTRA_DATABASE_URL: postgresql+psycopg://sistra:${POSTGRES_PASSWORD}@db:5432/sistra
      SISTRA_SECRET_KEY: ${SISTRA_SECRET_KEY:?isi SISTRA_SECRET_KEY di .env}
      SISTRA_SIGNING_KEY: ${SISTRA_SIGNING_KEY:?isi SISTRA_SIGNING_KEY di .env}
      SISTRA_SEED_DEMO: ${SISTRA_SEED_DEMO:-1}
      SISTRA_SEED_PASSWORD: ${SISTRA_SEED_PASSWORD:-sistra-demo-2027}
      SISTRA_CORS_ORIGINS: http://localhost:8080
    volumes:
      - blob-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  blob-data:
